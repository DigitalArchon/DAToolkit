<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; frame-src 'none'; object-src 'none'">
<title>DAToolkit companion</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  body { display: block; overflow: auto; padding: 12px; font-size: 16px; }
  .comp h1 { font-size: 18px; margin: 0 0 8px; display: flex; align-items: center; gap: 8px; }
  .comp .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .comp .cmd { font-family: var(--mono); font-size: 14px; white-space: pre-wrap; word-break: break-all; background: var(--bg); padding: 8px; border-radius: 6px; margin: 6px 0; }
  .comp .big { display: flex; gap: 8px; }
  .comp .big button { flex: 1; padding: 14px 8px; font-size: 16px; }
  .comp .hyp { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
  .comp .bar { height: 6px; background: var(--border); border-radius: 3px; flex: 1; overflow: hidden; }
  .comp .bar > div { height: 100%; background: var(--accent); }
  .comp .ai { white-space: pre-wrap; }
  .comp .row { display: flex; align-items: center; gap: 8px; }
  .comp .speak { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 15px; }
  .comp .speak input { width: 20px; height: 20px; }
  #photo-edit { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  #photo-canvas { width: 100%; height: auto; touch-action: none; border-radius: 6px; background: #000; }
  #photo-text { width: 100%; font-size: 16px; box-sizing: border-box; }
</style>
</head>
<body class="comp">
<h1>DAToolkit <span id="case" class="muted small"></span></h1>
<div id="ai" class="card">
  <div class="row"><span class="muted small">Last AI message</span><span class="spacer"></span>
    <button id="read-now" class="small" type="button">▶ Read</button>
    <button id="read-stop" class="small hidden" type="button" title="Stop reading">⏹ Stop</button></div>
  <div class="ai" id="ai-text">—</div>
  <label class="speak"><input type="checkbox" id="speak"> 🔊 Read new AI messages aloud as they arrive</label>
  <div class="muted small">Starts with the next message; ▶ Read reads the one above. Pause resumes from the start of the sentence.</div>
</div>
<div id="photo" class="card">
  <div class="big"><button id="photo-take" class="primary" type="button">📷 Photo to AI</button>
    <button id="photo-pick" type="button">Choose a photo</button></div>
  <div id="photo-why" class="muted small hidden"></div>
  <input type="file" id="photo-cam" accept="image/*" capture="environment" class="hidden">
  <input type="file" id="photo-file" accept="image/*" class="hidden">
  <div id="photo-edit" class="hidden">
    <div class="muted small">Drag over anything that shouldn't reach the AI (names, addresses, keys) to black it out.</div>
    <canvas id="photo-canvas"></canvas>
    <div class="row"><span id="photo-count" class="muted small"></span><span class="spacer"></span>
      <button id="photo-undo" class="small" type="button">Undo</button><button id="photo-clear" class="small" type="button">Clear</button></div>
    <textarea id="photo-text" rows="3" placeholder="What is this? e.g. output of 'show interfaces' on the core switch console"></textarea>
    <div class="big"><button id="photo-cancel" type="button">Cancel</button><button id="photo-send" class="primary" type="button">Send to AI</button></div>
  </div>
</div>
<div id="hyps" class="card hidden"><div class="muted small">Hypotheses</div><div id="hyp-list"></div></div>
<div id="queue"></div>
<div id="toasts"></div>
<script src="/static/companion.js"></script>
</body>
</html>
