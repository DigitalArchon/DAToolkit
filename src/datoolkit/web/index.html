<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Everything is served from this origin. In particular no remote images: a prompt injection
     must not be able to make the AI's markdown fetch a URL that carries data out. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://127.0.0.1:* ws://localhost:*; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'">
<title>DA Toolkit</title>
<link rel="icon" href="/static/icon.svg">
<link rel="stylesheet" href="/static/vendor/xterm.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header id="topbar">
  <span class="brand">DA Toolkit</span>
  <button id="case-btn" class="ghost" title="Start a new case, or open, edit or delete a previous one">No case</button>
  <button id="case-edit-btn" class="ghost small hidden" title="Rename this case, change its notes or raise its sensitivity">✎</button>
  <span id="sens-badge" class="badge"></span>
  <span class="spacer"></span>
  <button id="model-btn" class="ghost" title="Choose model"><span id="model-name">Choose model</span> <span id="tier-badge" class="badge"></span></button>
  <div class="menu-wrap">
    <button id="context-btn" class="ghost"><span id="usage">Context</span> ▾</button>
    <div id="context-menu" class="menu hidden">
      <button data-act="context">What the AI knows…</button>
      <button data-act="similar">Similar past cases…</button>
      <button data-act="timeline">Timeline replay</button>
      <div class="sep"></div>
      <button data-act="folder">Open case folder</button>
    </div>
  </div>
  <button id="attest-btn" class="ghost small hidden" title="Re-check the enclave's attestation"></button>
  <button id="vision-btn" class="ghost small" title=""></button>
  <button id="phone-btn" class="ghost small" title="Phone companion: follow the case and tick off commands from your phone">📱</button>
  <div class="menu-wrap">
    <button id="export-btn" class="ghost">Export ▾</button>
    <div id="export-menu" class="menu hidden">
      <button data-act="markdown">Export transcript (Markdown)…</button>
      <button data-act="full">Full export: prompts, reasoning, images…</button>
      <button data-act="summary">Ticket summary (AI)</button>
      <button data-act="client">Client update (AI)</button>
      <button data-act="runbook">Distil runbook (AI)</button>
    </div>
  </div>
  <button id="settings-btn" class="ghost">Settings</button>
  <button id="quit-btn" class="ghost hidden" title="Quit DA Toolkit: in the browser, closing the tab leaves it running">Quit</button>
</header>

<div id="keyring-banner" class="banner hidden"></div>
<div id="notice-banner" class="banner hidden"></div>

<main id="workspace">
  <section id="chat-pane">
    <button id="chat-strip" type="button" title="Show the chat (Ctrl+Shift+K)"><span>💬</span><span class="label">Chat</span><span class="unread hidden" title="New message from the AI"></span></button>
    <div id="hyp-board" class="hidden">
      <div class="hyp-head"><button id="hyp-toggle" class="ghost small" title="Show/hide">Hypotheses</button><span class="muted small">pin 📌 or rule out ✕ to steer the AI</span></div>
      <div id="hyp-list"></div>
    </div>
    <div id="chat-log"></div>
    <div id="chat-status" class="hidden" role="status" aria-live="polite"><span class="spinner"></span><span id="chat-status-text"></span></div>
    <form id="chat-form">
      <textarea id="chat-input" rows="3" placeholder="Describe the problem, answer the AI, or tell it what you think…  (Enter to send, Shift+Enter for newline, ↑ for history)"></textarea>
      <div id="attachments" class="hidden"></div>
      <div class="chat-actions">
        <button type="button" id="attach-btn" class="ghost" data-needs-vision title="Attach a photo (screen, LED panel, label). You can black out parts before it's sent.">📷</button>
        <input type="file" id="photo-input" accept="image/*" multiple class="hidden">
        <button type="button" id="shot-btn" class="ghost" data-needs-vision title="Attach a screenshot of the active session (useful for appliance menus). You can black out parts before it's sent.">🖥</button>
        <button type="button" id="chat-results-btn" class="hidden" title="Review the results of commands you ran or skipped and send them with this message">Results</button>
        <button type="button" id="stop-btn" class="danger hidden">Stop</button>
        <button type="submit" id="send-btn" class="primary">Send</button>
      </div>
    </form>
  </section>
  <div class="splitter vertical" id="split-v"></div>
  <section id="term-pane">
    <div id="tabs">
      <button id="chat-toggle" class="ghost small" type="button" title="Hide the chat, to give the terminal more room">«</button>
      <div id="tab-list"></div>
      <div class="menu-wrap">
<button id="tab-shot-btn" class="ghost" data-needs-vision title="Attach a screenshot of this terminal to your next chat message, e.g. when a login lands on a menu instead of a shell">Screenshot → chat</button>
                <button id="new-session-btn" class="ghost" title="Open a session">+ Session</button>
        <div id="session-menu" class="menu hidden"></div>
      </div>
    </div>
    <div id="terms">
      <div id="terms-empty" class="empty">No sessions open. Use <b>+ Session</b> to open a local shell, SSH, WinRM or RDP session.</div>
    </div>
  </section>
</main>

<div class="splitter horizontal" id="split-h"></div>

<section id="queue-pane">
  <div class="queue-head">
    <button id="queue-toggle" class="ghost small" type="button" title="Hide the queue list, to give the terminal more room">▾</button>
    <span class="title">Command queue</span>
    <span id="queue-count" class="muted"></span>
    <label class="muted small" title="Also show items already sent to the AI and items the AI withdrew"><input type="checkbox" id="show-done"> show done</label>
    <div class="menu-wrap">
      <button id="tools-btn" class="ghost">Recipes ▾</button>
      <div id="tools-menu" class="menu hidden">
        <button data-act="recipes">Recipe library…</button>
        <div class="sep"></div>
        <div class="label">Baseline (active session)</div>
        <button data-act="baseline-queue">Queue baseline snapshot</button>
        <button data-act="baseline-save">Save baseline from ran items</button>
        <button data-act="baseline-diff">Saved baselines: diff or delete…</button>
        <div class="sep"></div>
        <button data-act="rollback">Rollback ledger…</button>
      </div>
    </div>
    <span class="spacer"></span>
    <button id="send-selection-btn" class="ghost" title="Send the text selected in the terminal to the AI">Send terminal selection</button>
    <button id="send-results-btn" class="primary">Send results</button>
  </div>
  <div id="queue-list"></div>
</section>

<div id="modal-root"></div>
<div id="toasts"></div>

<script src="/static/vendor/xterm.js"></script>
<script src="/static/vendor/addon-fit.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/guacamole-common.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
