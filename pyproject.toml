[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "datoolkit"
version = "0.1.0b21"
description = "Gated AI diagnostic console: the AI proposes commands, the technician decides."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    # Anthropic's Messages API (llm/anthropic_api.py): the official endpoint and compatible ones.
    # 1.x, the line its streaming, model-list and pass-through fields were checked against;
    # 1.13.0 was the newest that had been out for two weeks when it was adopted (Oct 2026)
    "anthropic>=1.13,<2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pywebview>=5",
    "pypsrp>=0.8",
    "keyring>=25",
    "tomli-w>=1.0",
    # attached images are re-encoded from pixels only (safety/images.py)
    "pillow>=10",
    # RDP certificate pinning (sessions/rdpcert.py); TEE attestation (llm/tee.py, dcap.py, nras.py);
    # the companion's TLS certificate (companion.py)
    "cryptography>=42",
    # pairing QR codes for the phone companion (companion.py); pure Python
    "segno>=1.6",
    # TEE attestation requests (llm/tee.py) and web search
    "httpx>=0.27",
    # NanoGPT sends brotli-compressed replies; the OpenAI SDK's HTTP layer needs Brotli >= 1.2.
    # Pinned here so the venv never falls back to an older distro copy (Mint/Ubuntu ship 1.1).
    # 1.2.1 fixes CVE-2026-111497, an out-of-bounds write in the Brotli decoder (Oct 2026):
    # httpx and requests decode every Brotli reply with it, NanoGPT's included.
    "brotli>=1.2.1",
    # End-to-end encrypted NanoGPT Private Mode (llm/private_mode.py): Tinfoil's attestation
    # verifier and EHBP client. Pinned exactly: it holds the plaintext. tinfoil asks only for
    # tinfoil-ehbp>=0.3.0, so the library that seals and opens the bodies, and the HPKE under
    # it, are pinned here too, at the AppImage lock's versions (tests/test_private_mode.py
    # checks they agree): a source install took 0.4.0 the day it came out, a new request
    # framing: 0.15.0 and 0.4.1 were run against the enclave on Oct 22 2026 before being
    # adopted (SealedLoreDocs design/private.md).
    "tinfoil==0.15.0",
    "tinfoil-ehbp==0.4.1",
    "pyhpke==0.6.5",
    # The CA bundle httpx, the openai client and tinfoil's requests trust. 2026.10.19 drops emSign
    # ECC Root CA - G3, whose eMudhra intermediates had recoverable keys (Oct 2026); the floor keeps
    # a relock from standing still on an older one. AppRun prefers the host's own CA store.
    "certifi>=2026.10.19",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27"]

[project.scripts]
datoolkit = "datoolkit.app:main"
datoolkit-replay = "datoolkit.replay:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
datoolkit = ["web/*.html", "web/*.js", "web/*.css", "web/*.svg", "web/vendor/*", "training/scenarios/*.toml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
